<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rinder — Chat</title>
  <style>
    :root{
      --cream:#f6efe3;
      --paper:#fffaf2;
      --paper-2:#fbf3e8;
      --ink:#201b17;
      --muted:#7b6f64;
      --line:#e7d7c6;
      --orange:#ff6b2c;
      --orange-2:#ff8f4d;
      --peach:#ffd9bf;
      --dark:#29211c;
      --green:#6f8267;
      --shadow:0 18px 50px rgba(67,42,24,.08);
    }

    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--cream);color:var(--ink)}
    button,input{font:inherit}
    button{cursor:pointer}

    .app{
      min-height:100vh;
      display:grid;
      grid-template-columns:82px 300px 1fr;
      background:
        radial-gradient(circle at 90% 10%, rgba(255,173,116,.16), transparent 28%),
        radial-gradient(circle at 20% 90%, rgba(244,206,170,.18), transparent 30%),
        var(--cream);
    }

    /* Left nav */
    .rail{
      height:100vh;
      position:sticky;
      top:0;
      background:var(--dark);
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:14px 10px;
      gap:10px;
      border-right:1px solid rgba(255,255,255,.05);
    }

    .brand{
      width:48px;
      height:48px;
      border-radius:16px;
      background:linear-gradient(145deg,var(--orange),var(--orange-2));
      color:#fff;
      display:grid;
      place-items:center;
      font-weight:900;
      margin-bottom:10px;
      box-shadow:0 12px 26px rgba(255,107,44,.25);
    }

    .nav-btn{
      width:48px;
      height:48px;
      border:0;
      border-radius:16px;
      background:transparent;
      color:#d5c9bd;
      display:grid;
      place-items:center;
      font-size:1.15rem;
      transition:.18s ease;
    }

    .nav-btn:hover,.nav-btn.active{
      background:rgba(255,255,255,.1);
      color:#fff;
      transform:translateY(-2px);
    }

    .rail-spacer{flex:1}
    .profile-dot{
      width:38px;height:38px;border-radius:50%;
      background:var(--peach);color:#6c442b;
      display:grid;place-items:center;font-weight:800;
      border:2px solid rgba(255,255,255,.14)
    }

    /* Conversation list */
    .sidebar{
      height:100vh;
      position:sticky;
      top:0;
      background:rgba(255,250,242,.92);
      backdrop-filter:blur(12px);
      border-right:1px solid var(--line);
      padding:20px 16px;
      overflow:auto;
    }

    .sidebar h1{
      font-size:1.35rem;
      margin:0 0 16px;
      letter-spacing:-.03em;
    }

    .search{
      display:flex;
      align-items:center;
      gap:9px;
      background:#fffdfa;
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px 12px;
      margin-bottom:16px;
    }
    .search input{
      border:0;outline:0;background:transparent;width:100%;color:var(--ink)
    }

    .conversation{
      width:100%;
      border:0;
      background:transparent;
      display:flex;
      align-items:center;
      gap:11px;
      padding:11px 10px;
      border-radius:16px;
      text-align:left;
      margin-bottom:6px;
      transition:.18s;
      color:var(--ink);
    }

    .conversation:hover{background:#f7eadf;transform:translateX(3px)}
    .conversation.active{background:#ffe5d1}
    .avatar{
      width:42px;height:42px;border-radius:50%;
      background:linear-gradient(145deg,#ffd2b1,#ffae79);
      display:grid;place-items:center;font-weight:800;color:#6c4029;flex:0 0 auto;
    }
    .conv-copy{min-width:0;flex:1}
    .conv-copy strong{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conv-copy span{display:block;font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
    .time{font-size:.68rem;color:#9b8b7b}

    /* Chat pane */
    .chat{
      min-width:0;
      display:flex;
      flex-direction:column;
      height:100vh;
    }

    .chat-head{
      padding:18px 24px;
      display:flex;
      align-items:center;
      gap:12px;
      border-bottom:1px solid var(--line);
      background:rgba(255,250,242,.82);
      backdrop-filter:blur(10px);
      position:sticky;
      top:0;
      z-index:2;
    }
    .chat-head .avatar{width:44px;height:44px}
    .chat-head-copy strong{display:block}
    .chat-head-copy span{font-size:.78rem;color:var(--muted)}
    .chat-head-spacer{flex:1}
    .head-btn{
      width:40px;height:40px;border-radius:50%;
      border:1px solid var(--line);
      background:#fffdfa;color:var(--ink);
      transition:.18s
    }
    .head-btn:hover{transform:translateY(-2px);border-color:#f1aa7d}

    .messages{
      flex:1;
      overflow:auto;
      padding:26px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .day{
      align-self:center;
      font-size:.72rem;
      color:#9b8c7f;
      background:#f5e9dd;
      padding:6px 10px;
      border-radius:999px;
    }

    .message-row{
      display:flex;
      gap:8px;
      align-items:flex-end;
      max-width:75%;
    }
    .message-row.me{align-self:flex-end;flex-direction:row-reverse}
    .message-row.them{align-self:flex-start}

    .bubble{
      padding:11px 14px;
      border-radius:18px;
      line-height:1.42;
      box-shadow:0 8px 22px rgba(77,47,29,.04);
      font-size:.93rem;
    }
    .them .bubble{
      background:#fffdfa;
      border:1px solid var(--line);
      border-bottom-left-radius:6px;
    }
    .me .bubble{
      background:linear-gradient(135deg,var(--orange),var(--orange-2));
      color:#fff;
      border-bottom-right-radius:6px;
    }
    .stamp{
      font-size:.66rem;
      color:#9b8c7f;
      padding-bottom:3px;
      white-space:nowrap;
    }

    .typing{
      display:inline-flex;
      gap:4px;
      padding:9px 12px;
      border-radius:16px;
      background:#fffdfa;
      border:1px solid var(--line);
      width:max-content;
    }
    .typing i{
      width:6px;height:6px;border-radius:50%;
      background:#bdaea1;
      animation:bounce 1s infinite ease-in-out;
    }
    .typing i:nth-child(2){animation-delay:.14s}
    .typing i:nth-child(3){animation-delay:.28s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-4px);opacity:1}}

    .composer{
      padding:16px 22px 20px;
      border-top:1px solid var(--line);
      background:rgba(255,250,242,.94);
      display:flex;
      gap:10px;
      align-items:center;
    }
    .composer-box{
      flex:1;
      display:flex;
      align-items:center;
      gap:9px;
      border:1px solid var(--line);
      background:#fffdfa;
      border-radius:18px;
      padding:8px 10px 8px 13px;
      box-shadow:0 8px 25px rgba(67,42,24,.045);
    }
    .composer input{
      flex:1;
      border:0;
      outline:0;
      background:transparent;
      color:var(--ink);
    }
    .send{
      border:0;
      border-radius:14px;
      background:var(--orange);
      color:white;
      font-weight:800;
      padding:10px 14px;
      transition:.18s
    }
    .send:hover{background:#ef5c1f;transform:translateY(-1px)}
    .icon{
      border:0;background:transparent;color:#8d7e72;font-size:1rem;padding:7px;border-radius:10px
    }
    .icon:hover{background:#f3e8dc;color:var(--ink)}

    @media(max-width:900px){
      .app{grid-template-columns:72px 250px 1fr}
    }

    @media(max-width:700px){
      .app{grid-template-columns:1fr}
      .rail{position:fixed;z-index:10;left:10px;right:10px;bottom:10px;top:auto;width:auto;height:64px;border-radius:22px;flex-direction:row;justify-content:space-around;padding:8px}
      .brand,.rail-spacer{display:none}
      .sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-bottom:10px}
      .chat{height:calc(100vh - 170px)}
      .page-spacer{height:72px}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Rinder navigation">
      <div class="brand">R</div>
      <button class="nav-btn" title="Home">⌂</button>
      <button class="nav-btn" title="Listings">▤</button>
      <button class="nav-btn" title="People">◎</button>
      <button class="nav-btn active" title="Messages">✉</button>
      <button class="nav-btn" title="Me">◉</button>
      <div class="rail-spacer"></div>
      <div class="profile-dot">KH</div>
    </aside>

    <aside class="sidebar">
      <h1>Messages</h1>
      <div class="search">
        <span>⌕</span>
        <input type="text" placeholder="Search conversations" />
      </div>

      <button class="conversation active" data-name="Christine Ronaldo" data-initials="CR">
        <div class="avatar">CR</div>
        <div class="conv-copy">
          <strong>Christine Ronaldo</strong>
          <span>yo whats good bro</span>
        </div>
        <span class="time">2m</span>
      </button>

      <button class="conversation" data-name="Ves Wang" data-initials="VW">
        <div class="avatar">VW</div>
        <div class="conv-copy">
          <strong>Ves Wang</strong>
          <span>You: sounds good</span>
        </div>
        <span class="time">1h</span>
      </button>
    </aside>

    <main class="chat">
      <header class="chat-head">
        <div class="avatar" id="activeAvatar">CR</div>
        <div class="chat-head-copy">
          <strong id="activeName">Christine Ronaldo</strong>
          <span>Active now</span>
        </div>
        <div class="chat-head-spacer"></div>
        <button class="head-btn" title="More options">•••</button>
      </header>

      <section class="messages" id="messages">
        <div class="day">Today</div>

        <div class="message-row them">
          <div class="bubble">yo whats good bro</div>
          <div class="stamp">6:41 PM</div>
        </div>

        <div class="message-row me">
          <div class="bubble">not much, just checking Rinder</div>
          <div class="stamp">6:42 PM</div>
        </div>

        <div class="message-row them">
          <div class="bubble">same, that place near campus actually looks good</div>
          <div class="stamp">6:43 PM</div>
        </div>

        <div class="typing" aria-label="Typing">
          <i></i><i></i><i></i>
        </div>
      </section>

      <form class="composer" id="composer">
        <div class="composer-box">
          <button class="icon" type="button" title="Attach">＋</button>
          <input id="messageInput" type="text" placeholder="Message..." autocomplete="off" />
          <button class="icon" type="button" title="Emoji">☺</button>
        </div>
        <button class="send" type="submit">Send</button>
      </form>
    </main>
  </div>

  <script>
    const composer = document.getElementById('composer');
    const input = document.getElementById('messageInput');
    const messages = document.getElementById('messages');

    composer.addEventListener('submit', e => {
      e.preventDefault();
      const value = input.value.trim();
      if (!value) return;

      const row = document.createElement('div');
      row.className = 'message-row me';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = value;
      const stamp = document.createElement('div');
      stamp.className = 'stamp';
      stamp.textContent = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});

      row.appendChild(bubble);
      row.appendChild(stamp);
      messages.appendChild(row);
      input.value = '';
      messages.scrollTop = messages.scrollHeight;
    });

    document.querySelectorAll('.conversation').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.conversation').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('activeName').textContent = btn.dataset.name;
        document.getElementById('activeAvatar').textContent = btn.dataset.initials;
      });
    });
  </script>
</body>
</html>
